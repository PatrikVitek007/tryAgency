<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Access | @kristiiinka_f</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --bg-card: #111111;
            --bg-modal: #161616;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
            --of-blue: #00AFF0; /* OnlyFans color */
            --fansly-blue: #00AEEF; /* Fansly color */
            --danger: #FF4757;
            --shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .bg-image {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background-size: cover;
            background-position: center top;
            z-index: -2;
            filter: blur(8px) brightness(0.35);
            transform: scale(1.1);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(5,5,5,0.1) 0%, rgba(5,5,5,0.95) 100%);
            z-index: -1;
            pointer-events: none;
        }

        h1, h2, h3 { font-family: 'Poppins', sans-serif; font-weight: 600; }
        .hidden { display: none !important; }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .overlay.fade-out { opacity: 0; pointer-events: none; }

        .modal {
            background: var(--bg-modal);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.05);
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        .overlay.fade-out .modal { transform: scale(0.9); }

        .modal h2 { margin-bottom: 15px; color: var(--of-blue); font-size: 28px; }
        .modal p { margin-bottom: 30px; color: var(--text-muted); font-size: 16px; }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn.primary { background: var(--of-blue); color: #fff; }
        .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 175, 240, 0.4); }
        .btn.secondary { background: #222; color: #fff; }
        .btn.secondary:hover { background: #2a2a2a; }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }

        .profile-pic-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 15px;
        }

        .profile-pic-container::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            background: linear-gradient(135deg, var(--of-blue) 0%, var(--fansly-blue) 100%);
            border-radius: 50%;
            z-index: -1;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-deep);
        }

        h1 { font-size: 24px; margin-bottom: 5px; letter-spacing: -0.5px; }
        .bio { color: var(--text-muted); font-size: 14px; max-width: 300px; margin-bottom: 0; }

        .urgency-box {
            width: 100%;
            background: rgba(255, 71, 87, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 71, 87, 0.2);
        }

        .urgency-box h3 {
            font-size: 13px;
            color: var(--danger);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer {
            font-family: 'Poppins', sans-serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2px;
        }

        .money-zone {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-of {
            background: #00AFF0;
            color: white;
            padding: 18px;
            font-size: 20px;
            animation: pulse-of 2s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-fansly {
            background: #2b2b2b;
            color: #00AEEF;
            border: 1px solid #00AEEF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-fansly:hover {
            background: rgba(0, 174, 239, 0.1);
        }

        @keyframes pulse-of {
            0% { box-shadow: 0 0 10px rgba(0, 175, 240, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(0, 175, 240, 0.6); transform: scale(1.02); }
            100% { box-shadow: 0 0 10px rgba(0, 175, 240, 0.3); transform: scale(1); }
        }

        .social-zone {
            margin-top: 20px;
            width: 100%;
        }

        .social-zone h4 {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            color: #555;
            text-decoration: none;
            transition: color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 11px;
        }

        .social-icon:hover { color: var(--text-main); }
        .social-icon svg { width: 24px; height: 24px; fill: currentColor; }

        footer {

            font-size: 11px;
            color: #333;
            text-align: center;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ageGate = document.getElementById('age-gate');
            const mainContent = document.getElementById('main-content');
            const btnYes = document.getElementById('btn-yes');
            const btnNo = document.getElementById('btn-no');
            const display = document.getElementById('countdown');
            
            let timerInterval;

            if (localStorage.getItem('ageVerified') === 'true') {
                showMainContent();
            }

            btnYes.addEventListener('click', () => {
                localStorage.setItem('ageVerified', 'true');
                showMainContent();
            });

            btnNo.addEventListener('click', () => {
                window.location.href = "https://www.google.com";
            });

            function showMainContent() {
                ageGate.classList.add('fade-out');
                setTimeout(() => {
                    ageGate.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                    startTimer(300, display);
                }, 500);
            }

            function startTimer(duration, display) {
                let timer = duration, minutes, seconds;
                timerInterval = setInterval(() => {
                    minutes = parseInt(timer / 60, 10);
                    seconds = parseInt(timer % 60, 10);
                    minutes = minutes < 10 ? "0" + minutes : minutes;
                    seconds = seconds < 10 ? "0" + seconds : seconds;
                    display.textContent = minutes + ":" + seconds;

                    if (--timer < 0) {
                        clearInterval(timerInterval);
                        display.textContent = "00:00";
                        display.style.color = "#FF4757";
                    }
                }, 1000);
            }
        });
    </script>
